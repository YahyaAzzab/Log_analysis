<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRIX — Dashboard</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/intro.css" />
  <link rel="stylesheet" href="/styles/dashboard.css" />
</head>
<body>
  <a class="skip-link" href="#dashboard">Skip to dashboard</a>
  <div id="intro" class="intro" aria-hidden="false">
    <div class="intro__stage">
      <div id="intro-logo-fly" class="intro__logo-fly">
        <svg id="intro-owl" class="intro__owl" viewBox="0 0 64 64" width="120" height="120" aria-hidden="true">
          <circle class="intro-draw intro-draw--ring" cx="32" cy="32" r="29" />
          <path class="intro-draw intro-draw--head" d="M32 8 L48 18 L48 36 L32 52 L16 36 L16 18 Z" />
          <path class="intro-draw intro-draw--ear" d="M18 16 L14 6 L24 14 Z" />
          <path class="intro-draw intro-draw--ear" d="M46 16 L50 6 L40 14 Z" />
          <path class="intro-draw intro-draw--eye" d="M23 22 L29 22 L29 30 C29 33.5 26.5 36 23 37.5 C19.5 36 17 33.5 17 30 L17 22 Z" />
          <path class="intro-draw intro-draw--eye" d="M41 22 L47 22 L47 30 C47 33.5 44.5 36 41 37.5 C37.5 36 35 33.5 35 30 L35 22 Z" />
          <rect class="intro-pupil" x="21.5" y="25" width="3" height="7" rx="1" />
          <rect class="intro-pupil" x="39.5" y="25" width="3" height="7" rx="1" />
          <path class="intro-draw intro-draw--beak" d="M32 34 L36 40 L32 44 L28 40 Z" />
        </svg>
      </div>
      <h1 id="intro-wordmark" class="intro__wordmark" aria-label="STRIX">
        <span class="intro__letter">S</span><span class="intro__letter">T</span><span class="intro__letter">R</span><span class="intro__letter">I</span><span class="intro__letter">X</span>
      </h1>
      <p id="intro-subtitle" class="intro__subtitle">Authentication Threat Intelligence</p>
    </div>
    <div class="intro__progress" aria-hidden="true"><div id="intro-progress-bar" class="intro__progress-bar"></div></div>
    <p class="intro__hint">Press Enter or click to skip</p>
  </div>
  <div id="dashboard" class="app is-hidden" aria-hidden="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="/js/shell.js" defer></script>
  <script src="/js/pages/dashboard.js" defer></script>
  <script src="/js/intro.js" defer></script>
</body>
</html>
